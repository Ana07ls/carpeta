<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Productos - Depósito Sánchez</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body style="background-color: #64849ab0;">
    <br>
    
    <div class="encabezado d-flex justify-content-between align-items-center px-4">
        <div class="d-flex align-items-center">
            <img src="recursos/jpg-removebg-preview.png" alt="Logo1" class="logo">
            <div class="marca ms-3">
                <h1 class="nombre">Depósito Sánchez</h1>
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Pedidos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="tienda.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <main class="container mt-5 mb-5">
        <section class="card shadow-sm p-4 mb-5" style="background-color: rgba(255, 255, 255, 0.9);">
            <h2 class="text-center mb-4" style="color: #086288;">Registro de Productos</h2>

            <form id="formProducto">
                <input type="hidden" id="idProducto">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del producto:</label>
                    <input type="text" class="form-control" id="nombre" placeholder="ejem. Coca-Cola Retornable 2.5L" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción:</label>
                    <textarea class="form-control" id="descripcion" rows="3" placeholder="Detalles del producto..."></textarea>
                </div>

                <div class="mb-3">
                    <label for="costo" class="form-label">Costo ($):</label>
                    <input type="number" class="form-control" id="costo" min="0" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label">Enlace de la imagen (URL):</label>
                    <input type="url" class="form-control" id="imagen">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar producto</button>
                    <button type="button" id="btnCancelar" class="btn btn-secondary" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section class="card shadow-sm p-4" style="background-color: rgba(255, 255, 255, 0.9);">
            <h2 class="text-center mb-4" style="color: #086288;">Catálogo de Productos</h2>

            <input type="text" id="buscador" class="form-control mb-4" placeholder="Busca el producto por nombre o descripción...">

            <div id="listaProductos" class="row row-cols-1 row-cols-md-3 g-4"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/productos.js"></script>
</body>
</html>
